# Builds the packaged application for Windows and Linux.
#
# Start it from the Actions tab ("Run workflow"):
# - release_tag empty: the builds are kept as workflow artifacts only.
# - release_tag set (for example v1.0): the builds are also attached to the
#   GitHub release of that tag, which is created as a pre-release if needed.
# Pushing a tag such as v1.0 has the same effect as setting release_tag.
name: build-app
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag of the release to attach the builds to (e.g. v1.0). Empty = build only."
        required: false
        default: ""
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, label: windows-x64}
          - {os: ubuntu-latest, label: linux-x64}
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      label: ${{ matrix.label }}
      tag: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
