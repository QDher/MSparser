# Builds the packaged application for Windows, macOS and Linux.
# - Manual start (Actions tab): the builds are kept as workflow artifacts.
# - Push of a tag such as v0.1.0: the builds are also attached to the
#   GitHub release of that tag (created as a pre-release if it does not exist).
name: build-app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, label: windows-x64}
          - {os: macos-latest, label: macos-arm64}
          - {os: ubuntu-latest, label: linux-x64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[ui,test]" pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm packaging/mzstab.spec
      - uses: actions/upload-artifact@v4
        with:
          name: mzstab-app-${{ matrix.label }}
          path: dist/mzstab-app
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python -c "import shutil; shutil.make_archive('mzstab-app-${{ matrix.label }}-${TAG}', 'zip', 'dist', 'mzstab-app')"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "mzstab $TAG" --notes "Automated build." || true
          gh release upload "$TAG" "mzstab-app-${{ matrix.label }}-${TAG}.zip" --clobber
