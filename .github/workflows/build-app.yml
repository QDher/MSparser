# Builds the packaged application for Windows, macOS and Linux.
#
# Start it from the Actions tab ("Run workflow"):
# - release_tag empty: the builds are kept as workflow artifacts only.
# - release_tag set (for example v0.1.0): the builds are also attached to the
#   GitHub release of that tag, which is created as a pre-release if needed.
# Pushing a tag such as v0.1.0 has the same effect as setting release_tag.
name: build-app
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to publish as a release (e.g. v0.1.0). Empty = build only."
        required: false
        default: ""
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, label: windows-x64}
          - {os: macos-latest, label: macos-arm64}
          - {os: ubuntu-latest, label: linux-x64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[ui,test]" pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm packaging/mzstab.spec
      - uses: actions/upload-artifact@v4
        with:
          name: mzstab-app-${{ matrix.label }}
          path: dist/mzstab-app
      - name: Attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="mzstab-app-${{ matrix.label }}-${TAG}"
          python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'dist', 'mzstab-app')" "$ZIP"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" \
            --prerelease --title "mzstab $TAG" --notes-file packaging/release_notes.md || true
          gh release upload "$TAG" "$ZIP.zip" --clobber
