# Waters TOF run. Paths are relative to this file.
# Settings not listed here are read from the data files or use defaults
# (see README, "Settings").
paths:
  samples: samples.csv
  components: components.yaml
  raw_dir: ../raw_waters
  mzml_dir: ../mzml_waters
  work_dir: ../work_waters
  report_dir: ../report_waters
convert:
  lockmass_mz: 556.2771       # leucine enkephalin [M+H]+; adjust to the reference used
  lockmass_mz_neg: 554.2615
extraction:
  ppm_windows: [25]           # starting value; check mass_error.png
  min_window_mda: 2.0
